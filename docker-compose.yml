services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pi_console}
      POSTGRES_USER: ${POSTGRES_USER:-pi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pi_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis123} ping | grep -q PONG"]

  # ===== Pi Console Core =====
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-7001}:7001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pi}:${POSTGRES_PASSWORD:-pi_local_dev}@postgres:5432/${POSTGRES_DB:-pi_console}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - exports:/app/exports

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:7001
      SEARXNG_URL: http://searxng:8080
    depends_on:
      - api
      - searxng
    volumes:
      - exports:/app/exports
      - ./agents:/app/agents:ro

  web:
    build:
      context: ./webui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  # ===== Search =====
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
    deploy:
      resources:
        limits:
          memory: 256M

  # ===== n8n Workflow Automation =====
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-pi}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-pi_local_dev}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://${N8N_HOST:-localhost}:5678/
      GENERIC_TIMEZONE: ${TZ:-Asia/Shanghai}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ===== Docmost Wiki =====
  docmost:
    image: docmost/docmost:latest
    restart: unless-stopped
    environment:
      APP_URL: ${DOCMOST_URL:-http://localhost:3000}
      APP_SECRET: ${DOCMOST_SECRET:-replace-with-openssl-rand-hex-32}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pi}:${POSTGRES_PASSWORD:-pi_local_dev}@postgres:5432/docmost
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/2
    ports:
      - "${DOCMOST_PORT:-3000}:3000"
    volumes:
      - docmost-data:/app/data/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400M

  # ===== Dify AI Platform =====
  dify-api:
    image: langgenius/dify-api:1.14.2
    restart: always
    environment:
      MODE: api
      SECRET_KEY: ${DIFY_SECRET_KEY:-sk-replace-with-random}
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER:-pi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pi_local_dev}
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /app/api/storage
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:-replace-with-random}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
    volumes:
      - dify-storage:/app/api/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  dify-worker:
    image: langgenius/dify-api:1.14.2
    restart: always
    environment:
      MODE: worker
      SECRET_KEY: ${DIFY_SECRET_KEY:-sk-replace-with-random}
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER:-pi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pi_local_dev}
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /app/api/storage
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:-replace-with-random}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
    volumes:
      - dify-storage:/app/api/storage
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  dify-web:
    image: langgenius/dify-web:1.14.2
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  dify-sandbox:
    image: langgenius/dify-sandbox:0.2.15
    restart: always
    environment:
      API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      GIN_MODE: release
    deploy:
      resources:
        limits:
          memory: 256M

  dify-plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.6.1-local
    restart: always
    environment:
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER:-pi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pi_local_dev}
      DB_DATABASE: dify_plugin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      SERVER_PORT: "5002"
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:-replace-with-random}
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-replace-with-random}
    volumes:
      - dify-plugin-storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    restart: always
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: none
    volumes:
      - weaviate-data:/var/lib/weaviate
    deploy:
      resources:
        limits:
          memory: 512M

  dify-nginx:
    image: nginx:latest
    restart: always
    volumes:
      - ./dify/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${DIFY_PORT:-8080}:80"
    depends_on:
      - dify-api
      - dify-web
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  pg-data:
  exports:
  redis-data:
  n8n-data:
  docmost-data:
  dify-storage:
  dify-plugin-storage:
  weaviate-data:
