services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pi_console}
      POSTGRES_USER: ${POSTGRES_USER:-pi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pi_local_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${PI_DATA_DIR:-~/PiConsoleData}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - ${PI_DATA_DIR:-~/PiConsoleData}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis123} ping | grep -q PONG"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-7001}:7001"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pi}:${POSTGRES_PASSWORD:-pi_local_dev}@postgres:5432/${POSTGRES_DB:-pi_console}
      PI_API_TOKEN: ${PI_API_TOKEN:-}
      WORKER_SECRET: ${WORKER_SECRET:-change-me}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/coding/paas/v4}
      GLM_MODEL: ${GLM_MODEL:-glm-5.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${PI_DATA_DIR:-~/PiConsoleData}/exports:/app/exports
      - ${PI_DATA_DIR:-~/PiConsoleData}/agents:/app/agents:ro

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      API_BASE_URL: http://api:7001
      WORKER_SECRET: ${WORKER_SECRET:-change-me}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/coding/paas/v4}
      GLM_MODEL: ${GLM_MODEL:-glm-5.1}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      AGENTS_DIR: /app/agents
    depends_on:
      - api
    volumes:
      - ${PI_DATA_DIR:-~/PiConsoleData}/agents:/app/agents:ro

  web:
    build:
      context: ./webui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      - api

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
    deploy:
      resources:
        limits:
          memory: 256M
    profiles:
      - search
